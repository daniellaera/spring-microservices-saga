# Dashboard provider for the grafana (otel-lgtm) container, mounted next to the image's own
# provisioning/dashboards/grafana-dashboards.yaml.
apiVersion: 1

providers:
  - name: "infra-node1"
    type: file
    options:
      path: /otel-lgtm/grafana-dashboard-infra-node1.json
      foldersFromFilesStructure: false
