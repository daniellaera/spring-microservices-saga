app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 900000            # 15 minutes in prod
    refresh-expiration: 604800000 # 7 days

spring:
  datasource:
    username: ${DB_USER:testuser}
    password: ${DB_PASSWORD}
  kafka:
    producer:
      properties:
        max.block.ms: 1000
        request.timeout.ms: 1000
        delivery.timeout.ms: 2000
