name: Build and Deploy Online Shop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:bookworm-2
    outputs:
      config-server: ${{ steps.filter.outputs.config-server }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      order-service: ${{ steps.filter.outputs.order-service }}
      inventory-service: ${{ steps.filter.outputs.inventory-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      gateway-service: ${{ steps.filter.outputs.gateway-service }}
      cart-service: ${{ steps.filter.outputs.cart-service }}
      audit-trail-service: ${{ steps.filter.outputs.audit-trail-service }}
      shop-ui: ${{ steps.filter.outputs.shop-ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            config-server:
              - 'config-server/**'
            auth-service:
              - 'auth-service/**'
            order-service:
              - 'order-service/**'
            inventory-service:
              - 'inventory-service/**'
            payment-service:
              - 'payment-service/**'
            notification-service:
              - 'notification-service/**'
            gateway-service:
              - 'gateway-service/**'
            cart-service:
              - 'cart-service/**'
            audit-trail-service:
              - 'audit-trail-service/**'
            shop-ui:
              - 'shop-ui/**'

  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:bookworm-2
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.auth-service == 'true' ||
      needs.detect-changes.outputs.order-service == 'true' ||
      needs.detect-changes.outputs.inventory-service == 'true' ||
      needs.detect-changes.outputs.payment-service == 'true' ||
      needs.detect-changes.outputs.notification-service == 'true' ||
      needs.detect-changes.outputs.gateway-service == 'true' ||
      needs.detect-changes.outputs.cart-service == 'true' ||
      needs.detect-changes.outputs.audit-trail-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run backend tests
        run: |
          mvn verify \
            -pl auth-service,order-service,inventory-service,payment-service,notification-service,cart-service,audit-trail-service,coverage-report \
            -am \
            --no-transfer-progress
      - name: Enforce coverage gate
        run: ./scripts/check-coverage.sh

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:bookworm-2
    needs: detect-changes
    if: needs.detect-changes.outputs.shop-ui == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install and build
        working-directory: shop-ui
        run: |
          npm ci
          npx ng build --configuration=production

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:bookworm-2
    needs: [ detect-changes, test-backend, test-frontend ]
    if: always() && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Images are pushed as :latest and :${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push config-server
        if: needs.detect-changes.outputs.config-server == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: config-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/config-server:latest
            daniellaera/config-server:${{ steps.tag.outputs.sha }}

      - name: Free up space
        run: docker builder prune -f && docker image prune -f

      - name: Build and push auth-service
        if: needs.detect-changes.outputs.auth-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: auth-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/auth-service:latest
            daniellaera/auth-service:${{ steps.tag.outputs.sha }}

      - name: Free up space
        run: docker builder prune -f && docker image prune -f

      - name: Build and push order-service
        if: needs.detect-changes.outputs.order-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: order-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/order-service:latest
            daniellaera/order-service:${{ steps.tag.outputs.sha }}

      - name: Free up space
        run: docker builder prune -f && docker image prune -f

      - name: Build and push inventory-service
        if: needs.detect-changes.outputs.inventory-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: inventory-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/inventory-service:latest
            daniellaera/inventory-service:${{ steps.tag.outputs.sha }}

      - name: Free up space
        run: docker builder prune -f && docker image prune -f

      - name: Build and push payment-service
        if: needs.detect-changes.outputs.payment-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: payment-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/payment-service:latest
            daniellaera/payment-service:${{ steps.tag.outputs.sha }}

      - name: Free up space
        run: docker builder prune -f && docker image prune -f

      - name: Build and push notification-service
        if: needs.detect-changes.outputs.notification-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: notification-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/notification-service:latest
            daniellaera/notification-service:${{ steps.tag.outputs.sha }}

      - name: Free up space
        run: docker builder prune -f && docker image prune -f

      - name: Build and push cart-service
        if: needs.detect-changes.outputs.cart-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cart-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/cart-service:latest
            daniellaera/cart-service:${{ steps.tag.outputs.sha }}

      - name: Free up space
        run: docker builder prune -f && docker image prune -f

      - name: Build and push audit-trail-service
        if: needs.detect-changes.outputs.audit-trail-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: audit-trail-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/audit-trail-service:latest
            daniellaera/audit-trail-service:${{ steps.tag.outputs.sha }}

      - name: Free up space
        run: docker builder prune -f && docker image prune -f

      - name: Build and push gateway-service
        if: needs.detect-changes.outputs.gateway-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gateway-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/gateway-service:latest
            daniellaera/gateway-service:${{ steps.tag.outputs.sha }}

      - name: Free up space
        run: docker builder prune -f && docker image prune -f

      - name: Inject build version into shop-ui
        if: needs.detect-changes.outputs.shop-ui == 'true'
        run: |
          SHORT_SHA="${{ steps.tag.outputs.sha }}"
          sed -i "s/BUILD_NUMBER_PLACEHOLDER/${SHORT_SHA}/" \
            shop-ui/src/environments/environment.prod.ts
          echo "Build version: ${SHORT_SHA}"

      - name: Build and push shop-ui
        if: needs.detect-changes.outputs.shop-ui == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: shop-ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            daniellaera/shop-ui:latest
            daniellaera/shop-ui:${{ steps.tag.outputs.sha }}

      - name: Final Runner Purge
        if: always()
        run: docker builder prune -f && docker image prune -f

  deploy:
    name: Deploy to infra-node1
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:bookworm-2
    needs: [ detect-changes, build-and-push ]
    if: always() && !failure() && !cancelled()
    steps:
      - name: Fetch secrets from Infisical and write .env
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            mkdir -p /srv/online-shop

            echo "=== Authenticating with Infisical ==="
            RESPONSE=$(curl -sf -X POST "http://192.168.1.163/api/v1/auth/universal-auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}")

            TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['accessToken'])")

            if [ -z "$TOKEN" ]; then
              echo "❌ Failed to authenticate with Infisical"
              exit 1
            fi
            echo "✅ Authenticated with Infisical"

            echo "=== Fetching secrets ==="
            curl -sf -X GET \
              "http://192.168.1.163/api/v3/secrets/raw?workspaceId=${{ secrets.INFISICAL_PROJECT_ID }}&environment=prod&secretPath=/" \
              -H "Authorization: Bearer $TOKEN" \
              | python3 -c "
            import sys, json
            data = json.load(sys.stdin)
            secrets = data.get('secrets', [])
            with open('/srv/online-shop/.env', 'w') as f:
                for s in secrets:
                    f.write(f\"{s['secretKey']}={s['secretValue']}\n\")
            print(f'✅ Written {len(secrets)} secrets to .env')
            "

      - name: Deploy on infra-node1
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            mkdir -p /srv/online-shop
            cd /srv/online-shop

            echo "=== Downloading latest compose file ==="
            curl -sSf "http://192.168.1.103:3000/daniellaera/spring-saga-store/raw/branch/main/docker-compose.yml" \
              -o docker-compose.yml
            echo "Compose file size: $(wc -c < docker-compose.yml) bytes"

            echo "=== Downloading latest init-db.sql ==="
            curl -sSf "http://192.168.1.103:3000/daniellaera/spring-saga-store/raw/branch/main/init-db.sql" \
              -o init-db.sql
            echo "init-db.sql size: $(wc -c < init-db.sql) bytes"

            echo "=== Pulling latest images ==="
            docker compose -f docker-compose.yml pull

            echo "=== Restarting changed services ==="
            CHANGED=""
            ${{ needs.detect-changes.outputs.config-server == 'true' && 'CHANGED="$CHANGED config-server"' || '' }}
            ${{ needs.detect-changes.outputs.auth-service == 'true' && 'CHANGED="$CHANGED auth-service"' || '' }}
            ${{ needs.detect-changes.outputs.order-service == 'true' && 'CHANGED="$CHANGED order-service"' || '' }}
            ${{ needs.detect-changes.outputs.inventory-service == 'true' && 'CHANGED="$CHANGED inventory-service"' || '' }}
            ${{ needs.detect-changes.outputs.payment-service == 'true' && 'CHANGED="$CHANGED payment-service"' || '' }}
            ${{ needs.detect-changes.outputs.notification-service == 'true' && 'CHANGED="$CHANGED notification-service"' || '' }}
            ${{ needs.detect-changes.outputs.gateway-service == 'true' && 'CHANGED="$CHANGED gateway-service"' || '' }}
            ${{ needs.detect-changes.outputs.cart-service == 'true' && 'CHANGED="$CHANGED cart-service"' || '' }}
            ${{ needs.detect-changes.outputs.audit-trail-service == 'true' && 'CHANGED="$CHANGED audit-trail-service"' || '' }}
            ${{ needs.detect-changes.outputs.shop-ui == 'true' && 'CHANGED="$CHANGED shop-ui"' || '' }}

            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            if [ -n "$CHANGED" ]; then
              echo "Restarting: $CHANGED"
              docker compose -f docker-compose.yml \
                up -d --no-deps --pull always $CHANGED

              # This run pushed every changed image as both :latest and :SHORT_SHA.
              # The digest identifies the image actually running; compare it with the tag on Docker Hub.
              echo "=== Deployed image tags ==="
              for SERVICE in $CHANGED; do
                IMAGE_ID=$(docker inspect --format '{{.Image}}' "$SERVICE")
                DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_ID")
                echo "Deployed $SERVICE: daniellaera/$SERVICE:${SHORT_SHA} (= :latest), running $DIGEST"
              done
            else
              echo "No services changed — skipping restart (nothing deployed for ${SHORT_SHA})"
            fi

            echo "=== Cleaning up ==="
            docker container prune -f
            docker image prune -a -f

            echo "=== Disk usage after cleanup ==="
            df -h /

            echo "=== Running containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            echo "=== Deploy complete ==="

  post-deploy-smoke:
    name: Post-deploy smoke checks
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:bookworm-2
    needs: [ detect-changes, deploy ]
    # only after a deploy that actually ran
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Check redeployed services on infra-node1
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            CHANGED=""
            ${{ needs.detect-changes.outputs.config-server == 'true' && 'CHANGED="$CHANGED config-server"' || '' }}
            ${{ needs.detect-changes.outputs.auth-service == 'true' && 'CHANGED="$CHANGED auth-service"' || '' }}
            ${{ needs.detect-changes.outputs.order-service == 'true' && 'CHANGED="$CHANGED order-service"' || '' }}
            ${{ needs.detect-changes.outputs.inventory-service == 'true' && 'CHANGED="$CHANGED inventory-service"' || '' }}
            ${{ needs.detect-changes.outputs.payment-service == 'true' && 'CHANGED="$CHANGED payment-service"' || '' }}
            ${{ needs.detect-changes.outputs.notification-service == 'true' && 'CHANGED="$CHANGED notification-service"' || '' }}
            ${{ needs.detect-changes.outputs.gateway-service == 'true' && 'CHANGED="$CHANGED gateway-service"' || '' }}
            ${{ needs.detect-changes.outputs.cart-service == 'true' && 'CHANGED="$CHANGED cart-service"' || '' }}
            ${{ needs.detect-changes.outputs.audit-trail-service == 'true' && 'CHANGED="$CHANGED audit-trail-service"' || '' }}
            ${{ needs.detect-changes.outputs.shop-ui == 'true' && 'CHANGED="$CHANGED shop-ui"' || '' }}

            # The check script of this very commit; downloaded first so a failed download fails the step
            SMOKE=$(curl -sSf "http://192.168.1.103:3000/daniellaera/spring-saga-store/raw/commit/${{ github.sha }}/scripts/post-deploy-smoke.sh")
            bash -c "$SMOKE" post-deploy-smoke $CHANGED

      # Read-only: no login, no order. The gateway health endpoint is not exposed publicly, so the gateway is
      # proven reachable through nginx by its 401 on an unauthenticated API call (a dead gateway gives 502/504).
      - name: Check the public site
        run: |
          set -u
          BASE=https://shop-staging.daniellaera.com
          check() {
            CODE=$(curl -s -o /dev/null --max-time 10 --retry 5 --retry-delay 5 --retry-all-errors \
              -w '%{http_code}' "$BASE$1" || true)
            echo "GET $1 -> $CODE (expected $2)"
            [ "$CODE" = "$2" ]
          }
          FAILED=0
          check / 200 || FAILED=1
          check /products 401 || FAILED=1
          exit $FAILED
