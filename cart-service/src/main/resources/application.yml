server:
  port: 8086

spring:
  application:
    name: cart-service
  config:
    import: "configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      show-details: always
