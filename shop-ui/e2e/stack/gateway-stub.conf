# Stands in for gateway-service: like the real one, API calls without a Bearer token get 401
server {
    listen 8080;
    default_type application/json;

    if ($http_authorization !~ "^Bearer .") {
        return 401;
    }

    location = /audit {
        alias /stub/audit-events.json;
    }

    location /orders {
        return 200 '{"content":[],"totalElements":0,"totalPages":0,"number":0}';
    }

    location /products {
        return 200 '[]';
    }

    location / {
        return 200 '{}';
    }
}
