# Local stack for the Playwright specs: the production build behind the real nginx.conf,
# with a stub gateway serving fixture JSON.
#   npx ng build --configuration production
#   docker compose -f e2e/stack/compose.yml up -d
#   npm run e2e
# CI (pr.yml) runs the same two servers inside the job container instead: ci-serve.sh.
# The @public specs need neither login nor payment, and are safe against production:
#   E2E_BASE_URL=https://shop-staging.daniellaera.com E2E_BUILD_SHA=<deployed sha> npm run e2e:public
name: shop-ui-e2e

services:
  shop-ui:
    image: nginx:alpine
    ports:
      - "18081:80"
    volumes:
      - ../../dist/shop-ui/browser:/usr/share/nginx/html:ro
      - ../../config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-service

  gateway-service:
    image: nginx:alpine
    volumes:
      - ./gateway-stub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./audit-events.json:/stub/audit-events.json:ro
