# Local stack for the Playwright specs: the production build behind the real nginx.conf,
# with a stub gateway serving fixture JSON.
#   npx ng build --configuration production
#   docker compose -f e2e/stack/compose.yml up -d
#   npm run e2e
name: shop-ui-e2e

services:
  shop-ui:
    image: nginx:alpine
    ports:
      - "18081:80"
    volumes:
      - ../../dist/shop-ui/browser:/usr/share/nginx/html:ro
      - ../../config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-service

  gateway-service:
    image: nginx:alpine
    volumes:
      - ./gateway-stub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./audit-events.json:/stub/audit-events.json:ro
