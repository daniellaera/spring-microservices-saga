<div class="p-4">
  <p-card header="Audit Trail">
    @if (loading()) {
      <div class="flex justify-content-center p-5">
        <p-progress-spinner strokeWidth="4" styleClass="w-3rem h-3rem" />
      </div>
    } @else {
      <div style="overflow-x:auto; -webkit-overflow-scrolling:touch">
      <p-table
        #dt
        [value]="events"
        [paginator]="true"
        [rows]="20"
        [rowsPerPageOptions]="[20, 50, 100]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="{first} to {last} of {totalRecords}"
        [globalFilterFields]="['userEmail','eventType','entityType','serviceName']"
        dataKey="id"
        [expandedRowKeys]="expandedRows"
        styleClass="p-datatable-sm"
        responsiveLayout="scroll">

        <ng-template pTemplate="caption">
          <div class="flex align-items-center justify-content-between">
            <input
              type="text"
              pInputText
              placeholder="Search..."
              (input)="dt.filterGlobal($any($event.target).value, 'contains')" />
            <p-button
              icon="pi pi-refresh"
              [text]="true"
              [rounded]="true"
              [loading]="loading()"
              (onClick)="loadEvents()"
              title="Refresh" />
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th style="width:3rem"></th>
            <th pSortableColumn="createdAt">Timestamp <p-sortIcon field="createdAt" /></th>
            <th pSortableColumn="eventType">Event <p-sortIcon field="eventType" /></th>
            <th pSortableColumn="userEmail">User <p-sortIcon field="userEmail" /></th>
            <th class="hidden md:table-cell">Entity</th>
            <th pSortableColumn="serviceName" class="hidden lg:table-cell">Service <p-sortIcon field="serviceName" /></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-event let-expanded="expanded">
          <tr>
            <td>
              <p-button
                [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
                [text]="true"
                [rounded]="true"
                (onClick)="toggleRow(event)" />
            </td>
            <td>{{ event.createdAt | date:'yyyy-MM-dd HH:mm:ss' }}</td>
            <td>
              <p-tag [value]="event.eventType" [severity]="severityFor(event.eventType)" />
            </td>
            <td>{{ event.userEmail }}</td>
            <td class="hidden md:table-cell">{{ event.entityType }} / {{ event.entityId }}</td>
            <td class="hidden lg:table-cell">{{ event.serviceName }}</td>
          </tr>
        </ng-template>

        <ng-template pTemplate="rowexpansion" let-event>
          <tr>
            <td colspan="6">
              <pre class="m-0 p-3 surface-100 border-round text-sm"
                   style="white-space:pre-wrap; word-break:break-word">{{ formatPayload(event.payload) }}</pre>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="6" class="text-center text-color-secondary py-4">
              No audit events found.
            </td>
          </tr>
        </ng-template>
      </p-table>
      </div>
    }
  </p-card>
</div>
