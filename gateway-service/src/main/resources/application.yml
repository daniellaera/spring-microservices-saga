server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/auth/**
            - id: order-stream
              uri: ${ORDER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/orders/stream
              metadata:
                response-timeout: -1
                connect-timeout: 5000
              # no time limit (see spring.cloud.circuitbreaker below): only a failure to reach order-service
              # falls back, never the length of the stream
              filters:
                - name: CircuitBreaker
                  args:
                    name: order-stream-cb
                    fallbackUri: forward:/fallback/order-stream
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: order-cb
                    fallbackUri: forward:/fallback/orders
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/products/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventory-cb
                    fallbackUri: forward:/fallback/products
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/transactions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: payment-cb
                    fallbackUri: forward:/fallback/transactions
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            - id: stripe-payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: payment-cb
                    fallbackUri: forward:/fallback/payments
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            - id: cart-service
              uri: ${CART_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/cart/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: cart-cb
                    fallbackUri: forward:/fallback/cart
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
            - id: audit-trail-service
              uri: ${AUDIT_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/audit/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: audit-cb
                    fallbackUri: forward:/fallback/audit

    # The order-stream route's breaker and its settings live here, next to the route, and not in config-server:
    # a gateway started against an older config-server would otherwise apply resilience4j's 1 s time limit
    circuitbreaker:
      resilience4j:
        disable-time-limiter-map:
          order-stream-cb: true
    # config-server unavailable at startup (a host reboot, a deploy that restarts it too): retry for about 85 s, then
    # fail. The import stays mandatory, so the gateway never starts on its local defaults alone.
    config:
      fail-fast: true
      request-connect-timeout: 3000
      request-read-timeout: 10000
      retry:
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 15000
        max-attempts: 10

  application:
    name: gateway-service
  config:
    import: "configserver:${CONFIG_SERVER_URI:http://localhost:8888}"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - circuitbreakers
          - metrics
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      order-stream-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

logging:
  level:
    io.github.resilience4j: INFO
    org.springframework.boot.actuator.autoconfigure.opentelemetry: INFO

